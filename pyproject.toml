[build-system]
requires = ["setuptools>=77.0.3", "setuptools_scm>=8", "wheel>=0.45.1", "pytest-runner>=6.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "rune-runtime"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
   "pydantic>=2.10.3",
   "python-dateutil>=2.9.0.post0",
   "tzdata>=2026.6"
]
optional-dependencies.dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.14.1",
    "types-python-dateutil>=2.9.0.20250809",
    "licenseheaders>=0.8.8",
    "pre-commit>=3.0.0"
]
description = "Runtime support for Python models and functions generated from Rune DSL"
readme = "README.md"
keywords = [
    "rune",
    "rune runtime",
]
license = "Apache-2.0"
authors = [
    { name = "Daniel Schwartz" },
    { name = "Plamen Neykov" },
    { name = "Rune Python Runtime contributors" }
]
classifiers = [
    "Development Status :: 6 - Mature",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://github.com/finos/rune-python-runtime"
Documentation = "https://github.com/finos/rune-python-runtime/blob/main/README.md"
Repository = "https://github.com/finos/rune-python-runtime"
Issues = "https://github.com/finos/rune-python-runtime/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_file = "src/rune/runtime/version.py"

[tool.pytest.ini_options]
pythonpath = [
    ".",
]
